<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Админ — {{ site_title }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Rubik+Mono+One&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/ransom.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-body">
<header class="site-header admin-header">
  <div class="container header-inner">
    <a class="logo" href="/admin">🛠 {{ site_title }} · Админ</a>
    <nav>
      <a href="/" target="_blank">Сайт ↗</a>
      <a href="/admin" class="{{ 'active' if request.url.path in ('/admin', '/admin/') }}">Обзор</a>
      <a href="/admin/articles/new" class="{{ 'active' if request.url.path.endswith('/new') }}">Новая статья</a>
      <a href="/admin/admins" class="{{ 'active' if request.url.path.startswith('/admin/admins') }}">Админы</a>
      {% if current_user %}
        <span class="who">@{{ current_user.username }}</span>
        <a href="/admin/logout">Выйти</a>
      {% endif %}
    </nav>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
