<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin — {{ site_title }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-body">
<header class="site-header admin-header">
  <div class="container header-inner">
    <a class="logo" href="/admin">🛠 {{ site_title }} · Admin</a>
    <nav>
      <a href="/" target="_blank">View site ↗</a>
      <a href="/admin" class="{{ 'active' if request.url.path in ('/admin', '/admin/') }}">Dashboard</a>
      <a href="/admin/articles/new" class="{{ 'active' if request.url.path.endswith('/new') }}">New article</a>
      {% if current_user %}
        <span class="who">@{{ current_user.username }}</span>
        <a href="/admin/logout">Log out</a>
      {% endif %}
    </nav>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>
</body>
</html>
